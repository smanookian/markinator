[package]
name = "markinator"
version = "0.1.5"
description = "Markdown editor and reader"
license = "MIT"
edition = "2021"

[[bin]]
name = "markinator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "8"
parking_lot = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
