<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>markinator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/highlight.css">
</head>
<body>
  <textarea id="editor" spellcheck="false" autofocus></textarea>
  <div id="view" hidden></div>
  <div id="edit-hit" hidden></div>
  <div id="search" hidden>
    <input id="search-input" placeholder="Find" spellcheck="false">
    <span id="search-count"></span>
  </div>
  <div id="status" hidden>
    <span id="status-mode">EDIT</span>
    <span id="status-file">Untitled</span>
    <span id="status-msg"></span>
    <span id="status-hint">Ctrl+E to toggle</span>
  </div>
  <script src="vendor/highlight.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
